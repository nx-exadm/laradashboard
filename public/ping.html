<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Status</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center;
        }
        .status-dot {
            width: 14px;
            height: 14px;
            background-color: #2ec4b6;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }
        h1 {
            color: #1d3557;
            font-size: 24px;
            margin: 10px 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        p {
            color: #6c757d;
            margin: 0;
            font-size: 14px;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 196, 182, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(46, 196, 182, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(46, 196, 182, 0); }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1><span class="status-dot"></span> Server working properly</h1>
        <p>Norielix Server: Online</p>
    </div>

</body>
</html>
